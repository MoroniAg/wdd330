<!doctype html>

<html lang="en">

  <head>
    <meta charset="UTF-8" />
  
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
    <title>Sleep Outside | Checkout</title>
  
    <link rel="stylesheet" href="../css/style.css" />
  
    <script src="../js/CheckoutProcess.mjs" type="module"></script>
  </head>

<body>
  <header id="main-header" class="divider"> </header>

  <main class="divider">
    <div class="checkout-container">
      <section class="checkout-form">
        <h2>Review & Place your Order</h2>
        <form id="checkout-form">
          <fieldset>
            <legend>Customer Name</legend>
            <div class="form-group">
              <label for="first-name">First Name</label>
              <input type="text" id="first-name" name="first-name" required />
            </div>
            <div class="form-group">
              <label for="last-name">Last Name</label>
              <input type="text" id="last-name" name="last-name" required />
            </div>
          </fieldset>

          <fieldset>
            <legend>Address</legend>
            <div class="form-group">
              <label for="street">Street Address</label>
              <input type="text" id="street" name="street" required />
            </div>
            <div class="form-group">
              <label for="city">City</label>
              <input type="text" id="city" name="city" required />
            </div>
            <div class="form-group">
              <label for="state">State</label>
              <input type="text" id="state" name="state" required />
            </div>
            <div class="form-group">
              <label for="zip">Zip Code</label>
              <input type="text" id="zip" name="zip" required pattern="[0-9]{5}" title="Zip code must be 5 digits" />
            </div>
          </fieldset>

          <fieldset>
            <legend>Payment</legend>
            <div class="form-group">
              <label for="cc-number">Credit Card Number</label>
              <input type="text" id="cc-number" name="cc-number" required pattern="[0-9]{13,19}" title="Credit card number must be 13-19 digits" />
            </div>
            <div class="form-group">
              <label for="cc-exp">Expiration Date</label>
              <input type="text" id="cc-exp" name="cc-exp" required placeholder="MM/YY" pattern="(0[1-9]|1[0-2])\/[0-9]{2}" title="Expiration date must be in MM/YY format" />
            </div>
            <div class="form-group">
              <label for="cc-cvv">Security Code</label>
              <input type="text" id="cc-cvv" name="cc-cvv" required pattern="[0-9]{3,4}" title="Security code must be 3 or 4 digits" />
            </div>
          </fieldset>

          <button type="submit" id="submit-order">Place Order</button>
        </form>
      </section>

      <section class="order-summary">
        <h2>Order Summary</h2>
        <div id="summary-details">
          <p>Subtotal: <span id="subtotal">$0.00</span></p>
          <p>Tax: <span id="tax">$0.00</span></p>
          <p>Shipping: <span id="shipping">$0.00</span></p>
          <hr />
          <p class="total">Order Total: <span id="total">$0.00</span></p>
        </div>
      </section>
    </div>
  </main>

  <footer id="main-footer"></footer>
</body>

</html>
